providers = ["node"]

# pnpm 12 is installed with npm: the Corepack in the image cannot unpack it. The global npm bin dir is not on PATH
# in the build shell, so pnpm is called by its full path (`npm prefix -g` is the prefix npm installs into).

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = [
  "npm install -g pnpm@12.23.0",
  "\"$(npm prefix -g)/bin/pnpm\" install --frozen-lockfile"
]

[phases.build]
cmds = ["\"$(npm prefix -g)/bin/pnpm\" run build"]

[start]
cmd = "\"$(npm prefix -g)/bin/pnpm\" run start"
