# Checks: audit, lint, formatting, types, tests, build.
# Runs on pushes and pull requests to main. Deploy is not done here: Dokploy builds the app on a push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is taken from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit

      - run: pnpm lint

      - run: pnpm format:check

      # next-env.d.ts is gitignored: typegen creates it along with the route types
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
