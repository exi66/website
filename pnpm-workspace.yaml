  next@>=10.0.0 <15.5.24: '>=15.5.24'
  next@>=13.4.0 <15.5.24: '>=15.5.24'
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  sharp@<0.35.4: '>=0.35.4'
